    }).addTo(map);

    var markers = [];

    /* ── Co-location offset ──────────────────────────────────────
       Events sharing the same 1-dp lat/lng grid cell (~11 km) are
       spread in a circle: radius 0.15°, 60° per duplicate.
       The event data is already pre-spread for the main clusters
       (Paris, Berlin, Madrid), so this algorithm acts as a safety net.
    ─────────────────────────────────────────────────────────── */
    function computeOffsets(events) {
      var buckets = {};
      events.forEach(function (ev) {
        var key = ev.lat.toFixed(1) + '_' + ev.lng.toFixed(1);
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(ev.id);
      });

      var offsetMap = {};
      var OFFSET = 0.15; // degrees (~11-17 km at European latitudes)

      events.forEach(function (ev) {
        var key = ev.lat.toFixed(1) + '_' + ev.lng.toFixed(1);
        var bucket = buckets[key];
        var n = bucket.indexOf(ev.id);

        if (bucket.length === 1) {
          offsetMap[ev.id] = { lat: ev.lat, lng: ev.lng };
        } else {
          var angle = (n * 60) * (Math.PI / 180);
          offsetMap[ev.id] = {
            lat: ev.lat + OFFSET * Math.sin(angle),
            lng: ev.lng + OFFSET * Math.cos(angle)
          };
        }
      });

      return offsetMap;
    }

        var marker = L.circleMarker([pos.lat, pos.lng], {
          radius:      10,
          fillColor:   CATEGORY_COLORS[event.category],
          color:       '#fff',   // white stroke for contrast on all tile backgrounds
          weight:      2,
          opacity:     1,
          fillOpacity: 0.85

        marker.bindTooltip(

        marker.on('click', (function (ev) {

            showInfoPanel(ev);

        marker.addTo(map);
        markers.push({ leafletMarker: marker, event: event });

        /* Year match */
        var yearOk = ev.years.some(function(y){
          return y <= 2023 ? checkedYears.has('historic') : checkedYears.has(String(y));
        });

        /* Category match */
        var catOk = checkedCats.has(ev.category);

        /* Agent filter */
        var agentOk = !agentOnly || AGENT_IDENTIFIED_IDS.has(ev.id);

        if (yearOk && catOk && agentOk) {
          m.leafletMarker.addTo(map);
        } else {
          m.leafletMarker.remove();
        }
      });
    }

    /* ── Legend control (bottom-right) ───────────────────────── */
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      var div = L.DomUtil.create('div', 'map-legend');
      div.innerHTML = '<strong>Legend</strong>';
      Object.keys(CATEGORY_LABELS).forEach(function (key) {
        div.innerHTML +=
          '<div class="legend-item">' +
          '<span class="legend-dot" style="background:' + CATEGORY_COLORS[key] + '"></span>' +
          CATEGORY_LABELS[key] +
          '</div>';
      });
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    legend.addTo(map);

    /* ── Title control (top-left) ─────────────────────────────── */
    var titleCtrl = L.control({ position: 'topleft' });
    titleCtrl.onAdd = function () {
      var div = L.DomUtil.create('div', 'map-title');
      div.innerHTML =
        '<div class="map-title-h1">Russian Hybrid Warfare Events in Europe</div>' +
        '<div class="map-title-sub">Confirmed and suspected events, 2022\u20132026</div>';
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    titleCtrl.addTo(map);

    /* ── Year filter control (top-right) ─────────────────────── */
    var filterCtrl = L.control({ position: 'topright' });
    filterCtrl.onAdd = function () {
      var div = L.DomUtil.create('div', 'map-filter');
      div.innerHTML =
        '<div class="filter-title">Filter by year</div>' +
        '<label class="filter-label"><input type="checkbox" class="year-cb" value="historic" checked> Historic (&le;2023)</label>' +
        '<label class="filter-label"><input type="checkbox" class="year-cb" value="2024" checked> 2024</label>' +
        '<label class="filter-label"><input type="checkbox" class="year-cb" value="2025" checked> 2025</label>' +
        '<label class="filter-label"><input type="checkbox" class="year-cb" value="2026" checked> 2026</label>' +
        '<hr style="margin:0.55rem 0;border:none;border-top:1px solid #ddd;">' +
        '<div class="filter-title">Category</div>' +
        '<label class="filter-label"><input type="checkbox" class="cat-cb" value="kinetic" checked> <span style="color:#e74c3c;font-weight:700;">&#9679;</span> Kinetic / Physical</label>' +
        '<label class="filter-label"><input type="checkbox" class="cat-cb" value="cyber" checked> <span style="color:#e67e22;font-weight:700;">&#9679;</span> Cyberattack</label>' +
        '<label class="filter-label"><input type="checkbox" class="cat-cb" value="gps" checked> <span style="color:#d4ac0d;font-weight:700;">&#9679;</span> GPS / Aviation</label>' +
        '<label class="filter-label"><input type="checkbox" class="cat-cb" value="fridge" checked> <span style="color:#3498db;font-weight:700;">&#9679;</span> Fridge / Freezer</label>' +
        '<label class="filter-label"><input type="checkbox" class="cat-cb" value="murder" checked> <span style="color:#8e44ad;font-weight:700;">&#9679;</span> Assassination</label>' +
        '<hr style="margin:0.55rem 0;border:none;border-top:1px solid #ddd;">' +
        '<div class="filter-title">Intelligence</div>' +
        '<label class="filter-label" title="Show only events where a Russian agent, unit, or vessel was officially named or convicted"><input type="checkbox" id="agent-cb"> &#128373; Agent identified</label>';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      div.querySelectorAll('input').forEach(function(cb){
        cb.addEventListener('change', applyFilter);
      });
      return div;
    };
    filterCtrl.addTo(map);

    /* ── Wire everything up ───────────────────────────────────── */
    buildMarkers();

    /* Bind filter checkboxes (the control is now in the DOM) */
    var cbs = document.querySelectorAll('.year-cb');
    for (var i = 0; i < cbs.length; i++) {
      cbs[i].addEventListener('change', applyFilter);
    }

    /* Initial filter pass — all checked, so all 38 markers show */
    applyFilter();

  }); // end DOMContentLoaded
  </script>
</body>
</html>
